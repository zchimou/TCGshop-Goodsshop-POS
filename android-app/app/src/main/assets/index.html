<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>示例经营账</title>
  <style>
/* Contain horizontal date transitions without affecting vertical scrolling. */
.shell{overflow-x:clip;touch-action:pan-y pinch-zoom}
.date-notice{position:fixed;top:14px;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;z-index:70;display:flex;align-items:center;gap:11px;width:max-content;max-width:calc(100vw - 28px);padding:11px 18px 11px 12px;border:1px solid #ffffff40;border-radius:20px;background:#344dbb;color:#fff;box-shadow:0 8px 28px #283e8033;pointer-events:none;opacity:0;transform:translate(-50%,-14px);transition:opacity .18s ease,transform .22s ease}
.date-notice.show{opacity:1;transform:translate(-50%,0)}.date-notice-icon{display:grid;place-items:center;width:34px;height:34px;flex-shrink:0;background:#ffffff20;border-radius:11px;font-size:22px}.date-notice small{display:block;font-size:11px;color:#dce3ff;line-height:1.5}.date-notice strong{display:block;font-size:14px;line-height:1.6;font-variant-numeric:tabular-nums}
@media(prefers-reduced-motion:reduce){.date-notice{transition:none;transform:translate(-50%,0)}}

:root{--bg:#f4f6fb;--ink:#19243b;--muted:#7c879c;--line:#e5eaf3;--blue:#5066e9;--green:#119b72;--red:#df5965}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Microsoft YaHei",sans-serif;font-size:14px}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:11px;min-height:40px;padding:9px 14px;background:#eef1fc;color:#465ad4;white-space:nowrap;font-weight:600}button:hover{filter:brightness(.96)}button:active{transform:translateY(1px)}button:disabled{opacity:.5;cursor:wait}button:focus-visible,input:focus,select:focus{outline:2px solid #a4b3ff;outline-offset:2px}input,select{min-width:0;max-width:100%;width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink)}input::placeholder{color:#9aa3b5}
.shell{max-width:1100px;margin:auto;padding:28px 24px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:30px}.brand{display:flex;align-items:center;gap:12px;min-width:0}.store-logo{width:64px;height:64px;object-fit:contain;border-radius:14px;background:white;flex-shrink:0}.brand h1{font-size:25px;margin:0;letter-spacing:-.5px}.brand p{font-size:12px;color:var(--muted);margin:5px 0 0}.top-actions{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0}.top-actions input{width:142px;min-height:36px;font-size:12px;padding:7px 8px}.top-actions button{background:white;border:1px solid var(--line);color:#526077;min-height:36px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:20px}.hero h2{font-size:25px;margin:0 0 6px}.hero p{font-size:13px;color:var(--muted);margin:0}.primary,.full,.save-edit,#weekInfoBtn{background:var(--blue);color:white}.full{width:100%;min-height:46px}.hero #weekInfoBtn{flex-shrink:0;min-width:78px;box-shadow:0 4px 12px #5066e922}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}.metric,.panel{background:white;border:1px solid #e9edf5;border-radius:17px;box-shadow:0 5px 20px #25375305;min-width:0}.metric{padding:18px;border-top:3px solid #7483ef}.metric:nth-child(3){border-top-color:#eab175}.metric:last-child{border-top-color:#53b89b}.label,.metric small{color:var(--muted);font-size:12px}.metric strong{display:block;font-size:25px;margin:10px 0 4px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}.profit strong{color:var(--green)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}.grid>div{min-width:0}.panel{padding:22px}.panel-head,.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}.panel h3,.modal h3{font-size:17px;margin:0}.subtle{font-size:12px;color:var(--muted)}.panel-head .subtle{margin-left:auto}.form-row,.expense-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{margin-bottom:15px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}.calc{background:#f5f7fe;border-radius:12px;padding:14px;margin-bottom:16px}.calc-line{display:flex;justify-content:space-between;gap:10px;margin:8px 0;color:var(--muted);font-size:13px}.calc-line.total{border-top:1px solid #e1e7f5;padding-top:12px;color:var(--ink)}.calc-line.total b{font-size:20px;color:var(--green)}.expense{margin-top:20px}.expense-form button{background:#fdf0f2;color:var(--red)}
.records{max-height:640px;overflow:auto}.record{padding:16px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.record:last-child{border:0}.record-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.record-top strong{font-size:16px;min-width:0}.record-top>span{font-weight:650;color:var(--green);flex-shrink:0}.tag{display:inline-block;background:#eef1fc;color:#5665c8;border-radius:6px;font-size:11px;padding:4px 6px;margin:4px 0;font-weight:500}.record-bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:8px;color:var(--muted);font-size:12px;line-height:1.7}.record-bottom>span:first-child{min-width:0;overflow-wrap:anywhere}.record-actions{display:flex;gap:6px;flex-shrink:0}.record-actions button{font-size:12px;min-height:36px;padding:6px 9px}.danger{color:var(--red);background:#fff0f2}#dayHistory{font-size:12px;min-height:36px;padding:6px 10px}.empty{text-align:center;color:var(--muted);padding:40px 8px}
.modal-backdrop{display:none;position:fixed;inset:0;background:#17203366;z-index:30;padding:18px;align-items:center;justify-content:center}.modal-backdrop.show{display:flex}.modal{width:100%;max-width:540px;max-height:calc(100dvh - 36px);overflow:auto;background:white;border-radius:19px;padding:22px;box-shadow:0 20px 70px #15223d30}.close{width:40px;height:40px;min-height:40px;padding:0;flex-shrink:0;background:#f1f3f8;color:#6a768a;font-size:23px}.modal-actions{display:flex;gap:12px;margin-top:16px}.modal-actions button{flex:1}.sync-panel{display:flex;flex-direction:column;gap:12px;margin:0}.sync-status{display:block;background:#f4f6fc;padding:12px;border-radius:10px;color:var(--muted)}.sync-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sync-actions button:first-child{grid-column:1/-1}.sync-hint{color:var(--muted);line-height:1.7;font-size:12px;margin:0}.week-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.week-card{background:#f4f6fe;padding:14px;border-radius:12px;min-width:0}.week-card span{font-size:12px;color:var(--muted)}.week-card strong{display:block;font-size:21px;margin-top:6px;overflow-wrap:anywhere}.week-nav{display:flex;gap:8px;margin-bottom:14px}.week-nav button{flex:1;font-size:12px}.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#1b2943;color:#fff;padding:12px 18px;border-radius:12px;z-index:60;opacity:0;pointer-events:none;max-width:90vw}.toast.show{opacity:1}
@media(max-width:760px){.shell{padding:18px 14px 36px}.top{gap:10px;margin-bottom:24px}.store-logo{width:52px;height:52px}.brand{gap:8px}.brand h1{font-size:21px}.brand p{font-size:10px;max-width:145px;line-height:1.5}.top-actions input{width:130px}.hero h2{font-size:23px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{padding:14px 12px}.metric strong{font-size:21px}.grid{grid-template-columns:minmax(0,1fr);gap:16px}.panel{padding:18px}.expense{margin-top:16px}.modal{padding:18px}.record-top strong{font-size:15px}.record-bottom{flex-wrap:wrap}.record-actions{margin-left:auto}.records{max-height:none}}
@media(max-width:370px){.shell{padding:14px 10px}.store-logo{width:44px;height:44px}.brand h1{font-size:18px}.brand p{max-width:120px}.top-actions input{width:122px}.hero h2{font-size:21px}.panel{padding:14px}}

.auto-sync-options{display:grid;gap:12px}.auto-sync-options label{display:flex;align-items:center;gap:10px;line-height:1.6}.auto-sync-options input[type=checkbox]{width:20px;height:20px;min-height:20px;flex-shrink:0;accent-color:var(--blue)}#autoSyncStatus{overflow-wrap:anywhere;margin:0 0 14px}
.weekly-sales{margin-bottom:12px;background:linear-gradient(120deg,#edf2ff,#fff);border-top-color:var(--blue)!important}.weekly-sales strong{color:var(--blue);font-size:28px}.weekly-sales small{display:block;line-height:1.6}
.hero-actions{display:flex;gap:8px;flex-shrink:0}.hero-actions button{font-size:13px}.owner-total{background:#f4f6fe;border-radius:12px;padding:15px;margin-bottom:12px}.owner-total strong{display:block;font-size:24px;margin-top:6px;color:var(--blue)}
@media(max-width:760px){.hero{flex-wrap:wrap}.hero-actions{margin-left:auto}.hero-actions button{min-height:40px;padding:9px 12px}}
.hero-actions #colorToggleBtn{width:32px;height:32px;min-height:32px;flex:0 0 32px;align-self:center;padding:0;border:1px solid #aeb6c3;border-radius:8px;background:#bcc3ce;box-shadow:none}
.hero-actions #colorToggleBtn[aria-pressed="true"]{background:#22b573;border-color:#18975d}
.hero-actions #redToggleBtn{width:32px;height:32px;min-height:32px;flex:0 0 32px;align-self:center;padding:0;border:1px solid #aeb6c3;border-radius:8px;background:#bcc3ce;box-shadow:none}
.hero-actions #redToggleBtn[aria-pressed="true"]{background:#e65a67;border-color:#cf4250}
#recordNoteInput{display:block;width:100%;min-height:110px;resize:vertical;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;line-height:1.6;color:var(--ink)}
#dateContent{transform:translateZ(0);backface-visibility:hidden}
</style>
</head>
<body>
  <main class="shell">
    <header class="top"><div class="brand"><img class="store-logo" src="store-logo.svg" alt="店铺Logo" onerror="this.style.display='none';this.nextElementSibling.classList.add('logo-fallback')" /><div><h1>示例经营账</h1><p>轻量、快速的销售利润记录</p></div></div><input class="date" id="selectedDate" type="date" min="0001-01-01" max="9999-12-31" aria-label="选择记账日期" onchange="changeSelectedDate(this.value)" /></header>
    <section class="hero"><div><h2>今日经营概览</h2><p>记录金额，利润自动算好。</p></div><button class="primary" onclick="document.getElementById('amount').focus()">＋ 新增销售</button></section>
    <section class="metric weekly-sales" aria-label="本周销售额"><div class="label" id="weeklySalesLabel">本周销售额</div><strong id="weeklySalesTotal">¥0.00</strong><small id="weeklySalesRange"></small></section>
    <section class="sync-panel"><span class="sync-status" id="syncStatus">NAS同步</span><input id="serverUrl" value="http://192.0.2.10:5688" /><button onclick="testSync()">测试连接</button><button onclick="uploadSync()">上传数据</button><button onclick="downloadSync()">下载数据</button></section><section class="metrics"><div class="metric"><div class="label">今日销售额</div><strong id="salesTotal">¥0.00</strong><small id="salesCount">0 笔销售</small></div><div class="metric"><div class="label">今日成本</div><strong id="costTotal">¥0.00</strong><small>按成本倍率计算</small></div><div class="metric"><div class="label">今日支出</div><strong id="expenseTotal">¥0.00</strong><small>日常及固定支出</small></div><div class="metric profit"><div class="label">今日净利润</div><strong id="profitTotal">¥0.00</strong><small>销售利润 − 支出</small></div></section>
    <section class="grid"><div><div class="panel"><div class="panel-head"><h3>新增销售</h3><span class="subtle">金额优先，几秒完成</span></div><div class="field"><label>销售金额</label><input id="amount" type="number" min="0" step="0.01" placeholder="例如 100" oninput="calculate()" /></div><div class="form-row"><div class="field"><label>所属人</label><select id="owner"><option>共有</option><option>赤眸</option><option>冰玫瑰</option><option>不解语</option><option>老张</option></select></div><div class="field"><label>成本倍率</label><select id="rate" onchange="calculate()"><option value="0.75">75% · 默认</option><option value="0.7">70%</option><option value="0.8">80%</option><option value="0.85">85%</option><option value="0.9">90%</option></select></div></div><div class="form-row"><div class="field"><label>收款手续费</label><select id="feeRate" onchange="calculate()"><option value="0.0038">千分之3.8 · 默认</option><option value="0.006">千分之6</option></select></div><div class="field"><label>备注（可选）</label><input id="note" type="text" placeholder="例如：晚场" /></div></div><div class="calc"><div class="calc-line"><span>预计成本</span><b id="previewCost">¥0.00</b></div><div class="calc-line"><span>预计手续费</span><b id="previewFee">¥0.00</b></div><div class="calc-line total"><span>预计利润</span><b id="previewProfit">¥0.00</b></div><div class="calc-line"><span>利润率</span><b id="previewMargin">0%</b></div></div><button class="full" onclick="addSale()">保存这笔销售</button></div><div class="panel expense"><div class="panel-head"><h3>快速记支出</h3><span class="subtle">奖品单独记录</span></div><div class="expense-form"><input id="expenseAmount" type="number" min="0" step="0.01" placeholder="支出金额" /><select id="expenseType"><option>日常支出</option><option>月度固定支出</option><option>奖品支出</option></select><button onclick="addExpense()">记录</button></div></div></div><div class="panel"><div class="panel-head"><h3>今日记录</h3><span class="subtle" id="recordCount">0 条</span></div><div class="records" id="records"><div class="empty">还没有记录<br>从左侧添加第一笔销售吧</div></div></div></section>
  </main><div class="modal-backdrop" id="editModal"><div class="modal"><div class="modal-head"><h3>修改销售记录</h3><button class="close" onclick="closeEdit()">×</button></div><div class="field"><label>销售金额</label><input id="editAmount" type="number" min="0" step="0.01" /></div><div class="form-row"><div class="field"><label>所属人</label><select id="editOwner"><option>共有</option><option>赤眸</option><option>冰玫瑰</option><option>不解语</option><option>老张</option></select></div><div class="field"><label>成本倍率</label><select id="editRate"><option value="0.75">75%</option><option value="0.7">70%</option><option value="0.8">80%</option><option value="0.85">85%</option><option value="0.9">90%</option></select></div></div><div class="form-row"><div class="field"><label>收款手续费</label><select id="editFeeRate"><option value="0.0038">千分之3.8</option><option value="0.006">千分之6</option></select></div><div class="field"><label>备注</label><input id="editNote" type="text" /></div></div><div class="modal-actions"><button class="cancel" onclick="closeEdit()">取消</button><button class="save-edit" onclick="saveEdit()">保存修改</button></div></div></div><div class="toast" id="toast"></div>
  <div class="date-notice" id="dateNotice"><span class="date-notice-icon" id="dateNoticeIcon" aria-hidden="true">←</span><div role="status" aria-live="polite" aria-atomic="true" id="dateNoticeMessage"></div></div>
  <script src="sync.js"></script>
  <script>

const $=id=>document.getElementById(id), key='generic-preview-data';
const dateKey=d=>[String(d.getFullYear()).padStart(4,'0'),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const today=dateKey(new Date()), round=n=>Math.round((n+Number.EPSILON)*100)/100, money=n=>'¥'+Number(n||0).toFixed(2);
const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);
const escapeText=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data={sales:[],expenses:[],history:[],dateMarks:{},redDateMarks:{}},editingId=null,displayedDate=today;
function normalize(d){
 if(!d||!Array.isArray(d.sales)||!Array.isArray(d.expenses))throw Error('账本格式不正确');
 for(const [kind,rows] of [['sales',d.sales],['expenses',d.expenses]])for(const v of rows){
  if(!Number.isFinite(v.a)||v.a<=0)throw Error('账本包含无效金额');
  if(kind==='sales'&&(!Number.isFinite(v.r)||v.r<0||v.r>1||!Number.isFinite(v.f)||v.f<0))throw Error('账本包含无效成本或手续费');
  v.id=v.id||uid();v.date=v.date||today;v.history=Array.isArray(v.history)?v.history:[];
 }
 d.history=Array.isArray(d.history)?d.history:[];for(const field of ['dateMarks','redDateMarks'])d[field]=d[field]&&typeof d[field]==='object'&&!Array.isArray(d[field])?d[field]:{};return d;
}
try{data=normalize(JSON.parse(localStorage.getItem(key)||'{"sales":[],"expenses":[]}'));}catch(e){setTimeout(()=>toast('本地数据读取失败，原数据未覆盖，请先备份。'),200);}
$('selectedDate').value=today;
function persist(next,changed=true){try{localStorage.setItem(key,JSON.stringify(next));data=next;render();if(changed)queueAutoSync();return true;}catch(e){toast('保存失败，请检查设备存储空间');return false;}}
function transact(fn){const next=JSON.parse(JSON.stringify(data));fn(next);return persist(next);}
function amountValue(id){const n=Number($(id).value);if(!Number.isFinite(n)||n<=0||n>999999999){toast('请输入大于 0 的有效金额');return null;}if(round(n)<0.01){toast('金额至少为 0.01 元');return null;}return round(n);}
function calculate(){const a=Number($('amount').value)||0,c=round(a*Number($('rate').value)),f=round(a*Number($('feeRate').value));$('previewCost').textContent=money(c);$('previewFee').textContent=money(f);$('previewProfit').textContent=money(a-c-f);$('previewMargin').textContent=(a>0?(a-c-f)/a*100:0).toFixed(1)+'%';}
function stamp(){return {date:$('selectedDate').value||today,t:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),createdAt:new Date().toISOString(),id:uid(),history:[]};}
function addSale(){const a=amountValue('amount');if(a===null)return;if(transact(d=>d.sales.unshift({...stamp(),a,r:Number($('rate').value),f:round(a*Number($('feeRate').value)),feeRate:Number($('feeRate').value),owner:$('owner').value,n:$('note').value.trim()}))){$('amount').value='';$('note').value='';calculate();toast('销售已保存');}}
function addExpense(){const a=amountValue('expenseAmount');if(a===null)return;if(transact(d=>d.expenses.unshift({...stamp(),a,n:$('expenseType').value+($('expenseNote').value.trim()?' · '+$('expenseNote').value.trim():'')}))){$('expenseAmount').value='';$('expenseNote').value='';toast('支出已保存');}}
// Keep cash entries in the existing synced collection, with an explicit income type.
function addIncome(){const a=amountValue('incomeAmount');if(a===null)return;if(transact(d=>d.expenses.unshift({...stamp(),a,type:'income',n:'额外收入'+($('incomeNote').value.trim()?' · '+$('incomeNote').value.trim():'')}))){$('incomeAmount').value='';$('incomeNote').value='';toast('额外收入已保存');}}
function totals(day){const ss=data.sales.filter(v=>v.date===day),ee=data.expenses.filter(v=>v.date===day);const sales=round(ss.reduce((s,v)=>s+v.a,0)),cost=round(ss.reduce((s,v)=>s+round(v.a*v.r),0)),income=round(ee.filter(v=>v.type==='income').reduce((s,v)=>s+v.a,0)),spend=round(ss.reduce((s,v)=>s+v.f+(v.p||0),0)+ee.filter(v=>v.type!=='income').reduce((s,v)=>s+v.a,0));return {sales,cost,income,spend,profit:round(sales-cost-spend+income),count:ss.length};}
function render(){
 const day=$('selectedDate').value||displayedDate,t=totals(day),current=day===dateKey(new Date());
 $('selectedDate').value=day;displayedDate=day;
 if($('colorToggleBtn'))$('colorToggleBtn').setAttribute('aria-pressed',String(data.dateMarks?.[day]===true));
 if($('redToggleBtn'))$('redToggleBtn').setAttribute('aria-pressed',String(data.redDateMarks?.[day]===true));
 const weekStart=monday(localDate(day)),weekEnd=new Date(weekStart);weekEnd.setDate(weekEnd.getDate()+6);
 const startKey=dateKey(weekStart),endKey=dateKey(weekEnd),weekSales=data.sales.filter(v=>v.date>=startKey&&v.date<=endKey);
 $('weeklySalesLabel').textContent=startKey===dateKey(monday(new Date()))?'本周销售额':'所选周销售额';
 $('weeklySalesTotal').textContent=money(round(weekSales.reduce((sum,v)=>sum+v.a,0)));
 $('weeklySalesRange').textContent=startKey+' — '+endKey+'（周一至周日） · '+weekSales.length+' 笔销售';
 document.querySelector('.hero h2').textContent=current?'今日经营概览':day+' 概览';
 ['salesTotal','costTotal','expenseTotal','profitTotal'].forEach((id,i)=>$(id).textContent=money([t.sales,t.cost,t.spend,t.profit][i]));
 $('profitTotal').style.color=t.profit<0?'var(--red)':'var(--green)';
 $('salesCount').textContent=t.count+' 笔销售';
 $('incomeTotal').textContent=money(t.income);
 document.querySelectorAll('.metrics .metric .label').forEach((el,i)=>el.textContent=(current?'今日':'当日')+['销售额','成本','支出','净利润'][i]);
 $('recordsTitle').textContent=current?'今日记录':'当日记录';
 const rows=[...data.sales.map(v=>({...v,kind:'sales'})),...data.expenses.map(v=>({...v,kind:'expenses'}))].filter(v=>v.date===day).sort((a,b)=>(b.createdAt||b.t||'').localeCompare(a.createdAt||a.t||''));
 $('recordCount').textContent=rows.length+' 条';

function animateDateChange(direction){

 ],{duration:420,easing:'cubic-bezier(0.22, 0.68, 0.24, 1)',fill:'both'});
