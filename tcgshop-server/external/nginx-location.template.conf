# Add inside the EXISTING HTTPS server block for pos.example.com.
# Existing connection: Tencent Cloud -> Tailscale -> NAS.
# The installer checks that this NAS port responds as the POS service first.
# The final '/' strips the /tcgshop/ prefix. Keep existing ledger locations unchanged.
location ^~ /tcgshop/ {
    client_max_body_size 20m;
    proxy_pass http://192.0.2.10:5689/;
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header If-Match $http_if_match;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass_header ETag;
    proxy_cache off;
    proxy_redirect off;
    proxy_connect_timeout 10s;
    proxy_read_timeout 25s;
    proxy_send_timeout 25s;
}
